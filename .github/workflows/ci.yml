name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: CI only reads the checkout.
permissions:
  contents: read

# One run per ref. A new push to a PR cancels the superseded run; pushes to
# main always run to completion so every main commit keeps a real status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: typecheck / lint / format / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Before the install: this reads two files and imports only node
      # builtins. It proves the pinned CLI versions agree with each other --
      # not that they agree with the committed types, which the migrations
      # job checks separately and in parallel (issue #103).
      - name: Check the pinned Supabase CLI versions agree
        run: node scripts/check-supabase-cli-version.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

  functions:
    name: edge functions (deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v5

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          # Matches config.toml [edge_runtime].deno_version = 2.
          deno-version: v2.x

      # `deno check` typechecks the portable packages the functions import; the
      # engine tests run in the same runtime the edge function deploys to.
      - name: Format check
        run: deno fmt --check
      - name: Lint
        run: deno lint
      # Through the `deno.json` tasks, not a restatement of their paths: the
      # directory list already lives there, and a copy here is a copy CI reads
      # and nothing else checks. Adding `_shared/` had to touch both.
      - name: Typecheck
        run: deno task check
      - name: Test
        run: deno task test

  migrations:
    name: migration check / db tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # `scripts/supabase-cli-version.mjs` is the source for this version, and
      # `pnpm check:cli-version` fails when this copy drifts from it (issue
      # #103). A mismatch reproduces the type-drift failure this same job
      # checks for below, since different CLI versions emit slightly different
      # generic-type boilerplate for the same schema.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # `supabase start` replays every migration in supabase/migrations in order
      # from an empty database, so a migration that no longer applies — or that
      # breaks a later one — fails here.
      - name: Start local stack
        run: supabase start

      # The committed apps/web/lib/db/database.types.ts is derived from the
      # migrations. Regenerate it against the fresh schema and fail if it drifts
      # (issue #10) — the typed data layer must match what the database returns.
      #
      # Placed immediately after `supabase start`, and the position is
      # load-bearing. The types come from the migrations alone, so the first
      # moment the schema exists is the honest moment to check them, and
      # nothing that runs later can reach the check. Running it last meant any
      # step that left an object in `public` surfaced as type drift: a
      # `create extension dblink` in `safeupdate_authenticator_test.sql` swept
      # the whole dblink function set into the generated types and failed here,
      # pointing at the types file instead of at the test. Everything that
      # touches the database now runs after this step, so nothing else can
      # reach it -- which is the property worth having, independently of
      # whether any given later step actually leaks.
      #
      # The trade-off is that drift now stops the job before the seed check and
      # the pgTAP suite, so a red build reports one problem instead of two.
      # That is the right way round: this check is fast, drift is a
      # `pnpm gen:types` away from fixed, and `verify` and `functions` run as
      # separate jobs so their signal is unaffected.
      - name: Check generated types are current
        run: |
          supabase gen types typescript --local --schema public \
            > apps/web/lib/db/database.types.ts
          git diff --exit-code apps/web/lib/db/database.types.ts

      # `db lint` runs plpgsql_check over the resulting schema. --fail-on error
      # is what gives the step teeth; warnings still print.
      - name: Lint schema
        run: supabase db lint --local --level warning --fail-on error

      # seed_smoke_test.sql skips itself when the seed is absent (#109) so
      # the suite is usable on a shared local stack -- and pg_prove counts a
      # skip as a pass. CI is where the seed must actually load, so prove it
      # here, or the smoke test could retire silently.
      - name: Check the seed loaded
        run: |
          db_url="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          psql "$db_url" -tAc "select 1 from public.person where id = 'd0000000-0000-4000-8000-000000000001'" | grep -qx 1

      # pgTAP suite in supabase/tests: RLS allow/deny for every §5 policy plus
      # the shared-trigger coverage guards (SPEC §5, issue #9).
      - name: Run database tests
        run: supabase test db

      - name: Stop
        if: always()
        run: supabase stop
